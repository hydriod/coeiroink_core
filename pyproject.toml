    { index = "pytorch-cpu" },
]
espnet = { git = "https://github.com/espnet/espnet", rev = "bf02dd8c365547165c68e9b5067537086871c8e3" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
