[project]
name = "coeiroink-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.13"
dependencies = [
    "espnet",
    "pydantic>=2.11.7",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]
authors = [
    { "name" = "shirowanisan" },
    { "name" = "hydriod" }
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
